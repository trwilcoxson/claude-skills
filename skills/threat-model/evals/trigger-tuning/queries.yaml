# Labeled queries for trigger tuning. Positives should activate the threat-model skill;
# negatives are near-misses that should not (note several carry "security"/"threat" wording
# so the description has to discriminate on intent, not keywords).
queries:
  - id: tp-payment
    query: "Can you threat model our payment system?"
    should_trigger: true
  - id: tp-stride
    query: "Do a STRIDE analysis of this architecture."
    should_trigger: true
  - id: tp-attack-surface
    query: "Analyze the attack surface of our public API."
    should_trigger: true
  - id: tp-dfd
    query: "Produce a data flow diagram with trust boundaries for a security review."
    should_trigger: true
  - id: tp-arch-review
    query: "I need a security architecture review of our microservices deployment."
    should_trigger: true
  - id: tp-risks
    query: "What are the security risks in this system design?"
    should_trigger: true
  - id: tp-serverless
    query: "Model the threats against our serverless ingestion pipeline."
    should_trigger: true
  - id: tp-k8s
    query: "Do a security threat assessment of our Kubernetes platform."
    should_trigger: true
  - id: tp-attack-paths
    query: "Identify the attack paths through our authentication flow."
    should_trigger: true
  - id: tp-pasta
    query: "Run a PASTA attack simulation for our checkout flow."
    should_trigger: true

  - id: tn-unit-tests
    query: "Write unit tests for my CSV parser function."
    should_trigger: false
  - id: tn-code-bug
    query: "Review this function for bugs and fix the off-by-one error."
    should_trigger: false
  - id: tn-pytest
    query: "Help me figure out why this pytest is failing."
    should_trigger: false
  - id: tn-schema
    query: "Design a database schema for a users table."
    should_trigger: false
  - id: tn-homonym
    query: "Is there a threat of rain affecting our outdoor launch event?"
    should_trigger: false
  - id: tn-policy-summary
    query: "Summarize this security policy PDF into bullet points."
    should_trigger: false
