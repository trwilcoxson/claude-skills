id: agentic-rag-app
title: Threat model of an agentic RAG LLM application (tool-use orchestrator + vector store + ingestion
  pipeline)
category: positive
trigger_phrase: threat model our agentic AI chat assistant with tool-use and RAG
prompt: |-
  Please threat model our new agentic AI assistant. Architecture:

  - Chat frontend (React SPA) where customers ask questions. No login today — session cookie only.
  - Requests hit an Orchestrator Agent (Python, LangGraph) running in our VPC. The orchestrator is the "brain": it plans, calls a hosted LLM API (Anthropic) for reasoning, and decides which tools to invoke.
  - Tools available to the agent:
    1. Web Browse tool — fetches arbitrary URLs the model picks and returns page text into context.
    2. Code Exec tool — runs model-generated Python in a sandbox container to do data analysis.
    3. Internal DB Query tool — a function that takes a model-generated SQL string and runs it against our production Postgres (customer records, orders) using a single shared service account with broad read/write.
  - RAG: before answering, the orchestrator embeds the user query and retrieves top-k chunks from a Pinecone vector store, injecting them into the prompt as "context".
  - Ingestion pipeline: a nightly job scrapes external vendor docs, partner sites, and public web pages, chunks + embeds them, and upserts into the same Pinecone index. No content review.
  - The hosted LLM API key and the Postgres service-account creds live in env vars on the orchestrator host.
  - Agent runs tool calls autonomously with no human approval step; conversation memory is persisted per session and replayed on the next turn.

  We want to ship in 3 weeks. What are the security risks and how bad are they?
expected:
  must_trigger: true
  dfd_layers:
  - L1
  - L2
  - L3
  - L4
  stride_categories:
  - S
  - T
  - R
  - I
  - D
  - E
  - LM
  must_find_threats:
  - id: MF1
    description: 'Indirect (retrieval/ingestion) prompt injection: the nightly ingestion pipeline scrapes
      external vendor/partner/public pages with NO content review and upserts into the same Pinecone index
      the orchestrator retrieves from. An attacker plants malicious instructions on a scraped page; the
      poisoned chunk is retrieved into the prompt as trusted ''context'' and hijacks the agent into invoking
      tools (e.g., the DB Query or Web Browse tool) on the attacker''s behalf. Combines RAG retrieval
      poisoning + indirect prompt injection + tool-call injection / confused deputy.'
    stride: T
    min_severity: CRITICAL
  - id: MF2
    description: 'Excessive agency / over-permissioned Internal DB Query tool: the agent runs model-generated
      SQL against production Postgres via a single shared service account with broad read/WRITE, autonomously
      with no human-in-the-loop. A prompt-injected or jailbroken model can read all customer/order PII
      or execute destructive writes (UPDATE/DELETE/DROP). SQL injection via model-generated query + missing
      authorization + excessive agency.'
    stride: E
    min_severity: CRITICAL
  - id: MF3
    description: 'Code Exec sandbox escape / abuse: the Code Exec tool runs model-generated Python in
      a sandbox container. A jailbroken or injected model generates code that escapes the sandbox or,
      more directly, reads the orchestrator host''s environment (LLM API key, Postgres creds), makes outbound
      network calls, or pivots into the VPC — enabling lateral movement and credential theft.'
    stride: E
    min_severity: HIGH
  - id: MF4
    description: 'Web Browse tool SSRF: the agent fetches arbitrary model-chosen URLs from inside the
      VPC. An attacker (directly or via injection) steers the tool to internal endpoints or the cloud
      instance metadata service (IMDS) to exfiltrate cloud credentials, or to internal services not meant
      to be reachable. Classic agent-tool SSRF.'
    stride: I
    min_severity: HIGH
  - id: MF5
    description: 'Plaintext secrets / credential exposure: the hosted LLM API key and the Postgres service-account
      credentials are stored in plaintext env vars on the orchestrator host (no secrets manager, no rotation).
      Any code-exec foothold, log leak, or host compromise yields long-lived creds to the LLM API (cost/abuse)
      and production database.'
    stride: I
    min_severity: HIGH
  - id: MF6
    description: 'Unauthenticated frontend + session/memory poisoning + DoS: no user authentication (session
      cookie only) means unauthenticated abuse of an expensive autonomous agent (unbounded LLM/tool spend
      = financial DoS), no attribution/repudiation of who triggered tool calls, and persisted per-session
      conversation memory replayed each turn can be poisoned to carry an injection across turns.'
    stride: D
    min_severity: MEDIUM
  required_report_sections:
  - I. Executive Summary
  - II. System Overview
  - III. Architecture Diagram
  - IV. Risk Overlay Diagram
  - V. Asset Inventory
  - VI. Threat Actor Profiles
  - VII. Findings
  - VIII. Remediation Roadmap
  - XIII. Assumptions & Limitations
  top_risk_candidates:
  - MF1
  - MF2
  - MF3
rubric:
- id: R1
  criterion: 'Identifies indirect/retrieval prompt injection driven by the unreviewed ingestion pipeline
    poisoning the shared Pinecone index (MF1): names the ingestion->vector-store->retrieval->prompt ''context''
    path as the attack vector, ties it to tool abuse (agent invoking DB/Web tools on attacker''s behalf),
    and rates it HIGH or CRITICAL. The model should reference the RAG-specific and Agentic AI threat sections
    (retrieval poisoning + indirect prompt injection + tool-call injection / confused deputy).'
  weight: 5
- id: R2
  criterion: 'Flags the Internal DB Query tool as excessive agency / over-permissioned (MF2): explicitly
    calls out model-generated SQL, the single shared broad read/WRITE service account, and the lack of
    any human approval, classifies it as Elevation of Privilege (and/or Tampering/Information Disclosure),
    and rates it CRITICAL. Should reference a concrete attack path (injected/jailbroken model -> destructive
    or exfiltrating SQL).'
  weight: 5
- id: R3
  criterion: Surfaces BOTH the Code Exec sandbox-escape/host-env-read threat (MF3) AND the Web Browse
    SSRF-to-internal/IMDS threat (MF4), each with a realistic attack path; both rated at least HIGH. Sandbox
    escape tagged E and/or LM (lateral movement); SSRF tagged I (and SSRF/OWASP A10).
  weight: 4
- id: R4
  criterion: Calls out plaintext secrets in env vars on the orchestrator host (LLM API key + Postgres
    creds) as Information Disclosure with no secrets manager/rotation (MF5), rated at least HIGH, and
    connects it as a blast-radius amplifier for the code-exec/SSRF footholds (compromise of one tool ->
    credential theft).
  weight: 3
- id: R5
  criterion: 'Addresses the missing authentication on the frontend and its consequences: unauthenticated/unbounded
    use of an expensive autonomous agent as financial/availability DoS, lack of attribution (Repudiation),
    and persisted per-session memory replay as a cross-turn injection carrier (MF6). At least MEDIUM.'
  weight: 2
- id: R6
  criterion: 'Produces the layered Mermaid DFDs with trust boundaries: L1 architecture, L2 trust & identity,
    L3 data, and an L4 threat overlay with risk coloring and at least one attack-path overlay. The trust
    boundary between the UNTRUSTED ingestion/scraped-content + external web and the orchestrator/vector
    store is drawn explicitly, and the production Postgres is shown as a restricted/data-classification
    zone.'
  weight: 3
- id: R7
  criterion: 'Scores findings with OWASP Risk Rating (Likelihood x Impact, 1-5 each) mapped to the correct
    severity bands (CRITICAL 17-25, HIGH 10-16, MEDIUM 5-9, LOW 1-4), assigns STRIDE-LM letters, and ranks
    the prompt-injection-to-tool-abuse chain (MF1) OR the DB query tool excessive agency (MF2) as the
    #1 / top risk. Each finding has a concrete remediation (e.g., treat retrieved context as untrusted,
    least-privilege scoped read-only DB role with allow-listed parameterized queries, egress allow-list
    + IMDSv2/metadata block for tools, human-in-the-loop for high-impact tool calls, move secrets to a
    manager).'
  weight: 4
- id: R8
  criterion: Report contains the required sections (Executive Summary with posture rating + finding counts,
    System Overview, Architecture Diagram, Risk Overlay, Asset Inventory, Threat Actor Profiles, Findings
    with TM-NNN ids, Remediation Roadmap, Assumptions & Limitations) and does NOT inflate with irrelevant
    categories (e.g., no fabricated PCI/HIPAA compliance findings unless justified, no hallucinated MITRE/CWE
    IDs).
  weight: 2
pass_threshold: 0.8
grounding: 'Expectations are grounded directly in the threat-model skill''s reference frameworks. (1)
  frameworks.md "AI/ML Security Threats" section enumerates exactly the threats this scenario must surface:
  §A LLM (direct + indirect prompt injection, information leakage), §B Agentic AI (tool-call injection,
  excessive agency / over-permissioned tools, confused deputy via tool results, autonomous action with
  insufficient human-in-the-loop, agent memory/state poisoning), and §C RAG (retrieval poisoning, knowledge
  base exfiltration). SKILL.md Phase 3 mandates the AI/ML Security Assessment "if the system includes
  AI/ML or agentic components" and Phase 5 step 7 mandates AI-specific threats (prompt injection chains,
  tool abuse). MF1 (retrieval-poisoning + indirect injection + tool-call injection) and MF2 (excessive
  agency on DB tool) are the canonical instances. (2) MF2/MF3/MF4 also map to standard STRIDE-LM (frameworks.md):
  E (Elevation of Privilege / authorization), LM (Lateral Movement — container/host escape, pivot), I
  (Information Disclosure / SSRF). MF4 SSRF maps to OWASP A10:2021 / API7:2023 and CWE-918, and to the
  Cloud-Native "IMDS v1 SSRF to credential theft" pattern. MF3 maps to Cloud-Native "Container escape"
  + CWE-78 OS Command Injection. MF2 maps to CWE-89 / A03 Injection + CWE-862/863/269 authorization/privilege
  + A04 Insecure Design. MF5 maps to CWE-312 Cleartext Storage / CWE-798 / CWE-200 and the IAM "long-lived
  access keys / key sprawl" cloud pattern. MF6 maps to D (resource exhaustion CWE-400/770), R (repudiation
  — no attribution), and agent memory poisoning. (3) Severity bands and Likelihood x Impact scoring come
  from frameworks.md OWASP Risk Rating Methodology (bands CRITICAL 17-25, HIGH 10-16, MEDIUM 5-9, LOW
  1-4); the prompt-injection->tool-abuse->production-DB chain and the autonomous broad-write DB tool both
  have Likelihood >=4 (trivially reachable via a planted page or crafted query, automatable, unauthenticated)
  and Impact 5 (mass PII exfiltration / destructive writes / regulatory), yielding CRITICAL — justifying
  their top_risk_candidates ranking. (4) Required DFD layers L1-L4 and the trust-boundary requirement
  come from mermaid-layers.md (§2-§5) and SKILL.md Phase 2 (this is a 6-20 component medium system, so
  full 4-layer is required per the Scaling Guidelines and mermaid-layers §6). The untrusted-ingestion/external-web
  vs orchestrator boundary is the load-bearing L2 trust boundary; production Postgres is an L3 RESTRICTED
  data zone. (5) required_report_sections come from report-template.md Sections I-VIII + XIII (Networking/Compliance/Privacy
  sections IX-XI are conditional and may be N/A here, so they are not required). (6) PASTA Stages 6-7
  (frameworks.md) drive the attack-path + business-impact justification behind each Likelihood/Impact
  score. The R8 anti-inflation criterion is grounded in SKILL.md Guidelines (''do not inflate findings
  to fill a template'') and frameworks.md Framework ID Verification (no hallucinated MITRE/CWE IDs).'
