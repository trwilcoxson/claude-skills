# A target is just a real system you point the threat-model flow at — no answer key.
# Adding a target is adding one of these files and cloning the repo.
id: nodegoat
source: https://github.com/OWASP/NodeGoat
description: >
  OWASP NodeGoat — an intentionally insecure Express + MongoDB web app (auth, sessions,
  profile/allocations/benefits/memos features, DAOs, Docker/compose). Real attack surface;
  used here as a reference-free reliability target, not graded against a fixed answer key.
clone: git clone --depth 1 https://github.com/OWASP/NodeGoat.git
# repo path is supplied at runtime via --repo (local, ephemeral); not committed.
runs: 3   # N runs for stability
