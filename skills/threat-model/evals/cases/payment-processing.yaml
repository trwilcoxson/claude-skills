id: payment-processing
title: PCI-DSS Payment Processing Platform on AWS — Tokenization, Card Vault, and Unencrypted East-West
  Traffic
category: positive
trigger_phrase: threat model my PCI-DSS payment processing platform
prompt: |-
  Can you produce a threat model for our payment processing platform? We're PCI-DSS scoped and want a full security architecture review before our next QSA audit.

  Architecture:
  - React single-page web app (customer checkout) served via CloudFront, talks to an API Gateway behind an AWS ALB.
  - API Gateway routes to a Payments Service (ECS Fargate), which calls a Tokenization Service (ECS Fargate). The Tokenization Service is the only thing that talks to the Card-Data Vault — an RDS PostgreSQL instance that stores PAN (primary account numbers) at rest, encrypted with AWS KMS.
  - A Fraud-Scoring Service (ECS) calls a third-party fraud API over the public internet during each transaction.
  - An internal Admin Console (separate React app) lets ops staff issue refunds, view masked transactions, and manage merchant config.
  - An Analytics Pipeline replicates transaction records from the payments DB into an S3-backed data warehouse (Redshift) for BI.
  - AuthN/AuthZ is OAuth2 + JWT (Cognito) for both customer and admin flows.
  - Deployed on AWS: ALB, ECS Fargate, RDS, S3, KMS. Everything is in one VPC. Service-to-service calls inside the VPC are plain HTTP/gRPC — we do NOT currently use mTLS between services. JWTs are validated at the API Gateway but not re-validated on internal hops.

  Please give us the data flow diagrams, the STRIDE breakdown, and a prioritized risk list. Treat this as a comprehensive assessment.
expected:
  must_trigger: true
  dfd_layers:
  - L1
  - L2
  - L3
  - L4
  stride_categories:
  - S
  - T
  - R
  - I
  - D
  - E
  - LM
  must_find_threats:
  - id: MF1
    description: 'PAN at rest in the Card-Data Vault (RDS PostgreSQL) is exposed to information disclosure:
      KMS-at-rest encryption protects against media theft but not against a compromised Tokenization Service
      or over-broad RDS/KMS IAM grants, so a path to bulk PAN exfiltration exists. Must be flagged as
      the data crown jewel with a concrete attack path (compromised service -> KMS decrypt -> bulk PAN
      read/exfil) and tied to PCI-DSS Req 3 (protect stored cardholder data).'
    stride: I
    min_severity: CRITICAL
  - id: MF2
    description: No mTLS / unauthenticated east-west service-to-service traffic inside the single VPC
      (plain HTTP/gRPC, JWT not re-validated on internal hops) lets an attacker who lands on any one ECS
      task spoof a caller or pivot to the Tokenization Service / Vault. This is the lateral movement +
      spoofing finding driven by the absence of zero-trust internal auth.
    stride: LM
    min_severity: HIGH
  - id: MF3
    description: 'Tampering / sniffing of cardholder data in transit on internal hops: PAN and tokens
      move between Payments Service, Tokenization Service, and the Vault over plaintext HTTP/gRPC, so
      an attacker with VPC network position can intercept or modify card data in transit (man-in-the-middle),
      violating PCI-DSS Req 4 (encrypt transmission of cardholder data).'
    stride: T
    min_severity: HIGH
  - id: MF4
    description: 'Internal Admin Console refund/merchant-config functions lack defense-in-depth: JWT is
      only validated at the gateway and not re-checked internally, and privileged admin actions (refunds,
      config) create elevation-of-privilege / broken function-level authorization exposure (a compromised
      or over-scoped admin token can move money or alter merchant config). Tie to OWASP API5 / A01 and
      the need for step-up auth + internal authZ.'
    stride: E
    min_severity: HIGH
  - id: MF5
    description: Analytics replication pipeline copies transaction records into an S3/Redshift data warehouse
      — a CDE scope-expansion and information-disclosure risk if PAN or sensitive fields are replicated
      unmasked/untokenized, or if the S3 bucket / Redshift cluster has weaker controls than the vault.
      Flag data-aggregation and object-storage exposure (public bucket / over-broad bucket policy) plus
      PCI scope creep.
    stride: I
    min_severity: HIGH
  - id: MF6
    description: 'Fraud-Scoring Service makes an outbound call to a third-party fraud API over the public
      internet per transaction: risks include unsafe consumption of a third-party API, SSRF/egress abuse,
      sensitive transaction-data leakage to the third party, and an availability dependency (third-party
      outage stalls checkout). Tie to OWASP API10 / SSRF (CWE-918) and a DoS/availability impact.'
    stride: I
    min_severity: MEDIUM
  top_risk_candidates:
  - PAN-at-rest bulk exfiltration via compromised Tokenization Service abusing KMS decrypt (MF1)
  - Lateral movement to the Card-Data Vault via unauthenticated/no-mTLS east-west traffic (MF2)
  - Cardholder data tampering/interception in transit on plaintext internal hops (MF3)
  required_report_sections:
  - I. Executive Summary
  - II. System Overview
  - III. Architecture Diagram
  - IV. Risk Overlay Diagram
  - V. Asset Inventory
  - VI. Threat Actor Profiles
  - VII. Findings
  - VIII. Remediation Roadmap
  - IX. Networking & Infrastructure Data
  - XIII. Assumptions & Limitations
rubric:
- id: R1
  criterion: 'Identifies PAN-at-rest in the Card-Data Vault (RDS) as the crown-jewel asset, classifies
    it RESTRICTED, marks it inside a high-trust boundary in L2/L3, and ranks the PAN bulk-exfiltration
    finding (compromised Tokenization Service abusing KMS decrypt over-broad IAM) as CRITICAL (OWASP Risk
    17-25) with a concrete step-by-step attack path — and this finding (or the lateral-movement-to-vault
    finding) is ranked #1.'
  weight: 5
- id: R2
  criterion: Flags the absence of mTLS / unauthenticated east-west service-to-service traffic (JWT not
    re-validated on internal hops) as a HIGH+ finding covering BOTH Lateral Movement (LM) and Spoofing
    (S), explicitly invoking zero-trust / 'network position != trust', with a pivot path from a compromised
    ECS task to the Tokenization Service or Vault.
  weight: 5
- id: R3
  criterion: Flags cardholder-data-in-transit tampering/interception on internal plaintext hops (Tampering,
    HIGH+) and ties it to PCI-DSS Req 4; separately ties stored-PAN protection to PCI-DSS Req 3. PCI-DSS
    scope/compliance is acknowledged in the report (e.g., compliance mapping note or scope discussion).
  weight: 4
- id: R4
  criterion: Surfaces the analytics replication pipeline to S3/Redshift as a CDE scope-expansion / information-disclosure
    risk (unmasked PAN replication and/or object-storage misconfiguration), AND surfaces the third-party
    fraud API outbound call as unsafe third-party consumption / SSRF / data-leakage / availability-dependency
    risk.
  weight: 3
- id: R5
  criterion: Flags privileged Admin Console functions (refunds, merchant config) as Elevation-of-Privilege
    / broken function-level authorization (OWASP API5 / A01), recommending step-up auth and internal authZ
    rather than relying solely on gateway JWT validation.
  weight: 3
- id: R6
  criterion: Produces all four DFD layers (L1 Architecture, L2 Trust & Identity with trust boundaries
    around the CDE/vault, L3 Data with encryption state [ENC]/[PLAIN] on edges showing plaintext internal
    hops, L4 Threat Overlay with risk coloring and at least one attack-path overlay reaching the vault)
    as valid Mermaid; the L4 overlay marks the Vault and Tokenization Service highRisk.
  weight: 4
- id: R7
  criterion: Uses STRIDE-LM with OWASP Risk Rating (Likelihood x Impact, 1-5 each) and correct severity
    bands; assigns valid MITRE ATT&CK technique IDs and CWE IDs drawn from the reference set (e.g., T1078
    Valid Accounts, T1021 Remote Services, T1530 Data from Cloud Storage, CWE-311/CWE-312/CWE-862/CWE-918)
    — no fabricated IDs.
  weight: 3
- id: R8
  criterion: Delivers the report-template sections (Executive Summary with posture rating + finding counts,
    System Overview, Architecture + Risk Overlay diagrams, Asset Inventory, Threat Actor Profiles including
    Organized Crime/payment-fraud and Malicious Insider, Findings in TM-NNN format ordered by severity,
    Remediation Roadmap with waves/quick wins, and Assumptions) with each finding carrying a concrete
    remediation step.
  weight: 3
pass_threshold: 0.8
grounding: 'Expectations map directly to the skill''s frameworks. STRIDE-LM (frameworks.md §STRIDE-LM)
  supplies all 7 categories; the scenario''s defining weaknesses map cleanly: PAN-at-rest disclosure =
  Information Disclosure (I); unauthenticated east-west traffic = Lateral Movement (LM) + Spoofing (S),
  exactly the Zero Trust ''assume breach / micro-segmentation'' criteria (frameworks.md §Zero Trust: ''Is
  east-west traffic encrypted... Are database connections restricted to authorized services?''); plaintext
  internal card-data transit = Tampering (T); admin refund/config = Elevation of Privilege (E). Severities
  use OWASP Risk Rating bands (frameworks.md §OWASP Risk Rating: CRITICAL 17-25, HIGH 12-19[10-16 table],
  etc.). PAN is RESTRICTED/regulated under the CIA Impact Matrix (Confidentiality HIGH = ''financial...
  data exposed. Regulatory breach. Mass data exfiltration''), justifying Impact 5 and a CRITICAL top risk.
  PASTA Stage 6/7 (frameworks.md §PASTA) drives the concrete attack path and likelihood/impact scoring;
  relevant threat actors are Organized Crime (motivation: payment fraud) and Malicious Insider (privileged
  admin) per frameworks.md §Threat Actor Profiles. Cloud-native patterns justify the S3/Redshift object-storage
  exposure (frameworks.md §Object Storage: ''public bucket exposure, bucket policy misconfiguration'')
  and IAM over-permission (KMS decrypt). The fraud-API outbound call maps to OWASP API10:2023 Unsafe Consumption
  of APIs and SSRF/CWE-918 (frameworks.md §API Security Top 10, §CWE Input Validation). MITRE IDs (T1078,
  T1021, T1530) and CWEs (CWE-311 Missing Encryption, CWE-312 Cleartext Storage, CWE-862 Missing Authorization,
  CWE-918 SSRF) are all present in frameworks.md tables, satisfying the Framework ID Verification rule.
  The four DFD layers (L1-L4) and the threat-overlay attack-path requirement come from mermaid-layers.md
  §2-5; the required report sections come from report-template.md (Sections I-IX, XIII), with Section
  IX Networking/Infrastructure applicable because the system is explicitly AWS (ALB/ECS/RDS/S3/KMS/VPC).
  PCI-DSS Req 3 (stored cardholder data) and Req 4 (transmission encryption) are the controlling compliance
  anchors and the scenario explicitly states PCI-DSS scope, satisfying the SKILL.md Team-mode trigger
  (''financial data'', ''PCI-DSS'', ''IaC/cloud services'', >10 components).'
