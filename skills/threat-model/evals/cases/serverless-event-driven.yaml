id: serverless-event-driven
title: 'Threat Model: AWS Serverless Event-Driven Upload Processing Pipeline'
category: positive
trigger_phrase: threat model our AWS serverless event-driven pipeline
prompt: |-
  Please produce a threat model for our serverless event-driven document processing pipeline on AWS.

  Architecture:
  - Clients call a public REST endpoint on API Gateway (no WAF). API Gateway uses an API key only; there is no Cognito/JWT authorizer on the upload routes.
  - The ingest Lambda validates the request and returns a presigned S3 PUT URL (15-minute expiry, no content-length-range or content-type condition) so the client uploads the file directly to the `customer-uploads` S3 bucket.
  - An S3 ObjectCreated event goes to EventBridge; an EventBridge rule fans the event out to an SQS queue. There is no SQS dead-letter queue and no SQS server-side encryption.
  - Worker Lambdas poll SQS, download the object, parse it, and write extracted records (customer name, email, document text) into a DynamoDB table `Documents`.
  - All Lambdas share ONE IAM execution role. Its policy grants `s3:*`, `dynamodb:*`, and `sqs:*` on `Resource: "*"`.
  - Third-party API tokens and a DynamoDB-encryption passphrase are stored in plaintext Lambda environment variables.
  - The `customer-uploads` bucket has Block Public Access turned OFF and a bucket policy allowing `s3:GetObject` to `Principal: "*"`. Default SSE is not configured.
  - An EventBridge rule pattern matches on a client-supplied `source` field in the event detail.

  Region us-east-1, single AWS account. We handle customer PII (names, emails, uploaded ID documents). What are the risks?
expected:
  must_trigger: true
  dfd_layers:
  - L1
  - L2
  - L3
  - L4
  stride_categories:
  - S
  - T
  - I
  - D
  - E
  - LM
  must_find_threats:
  - id: MF1
    description: Single shared Lambda execution role with wildcard s3:*, dynamodb:*, sqs:* on Resource:*
      grants every function full account-wide data-plane access; compromise of any one function (or its
      dependencies) yields read/write/delete over all S3 objects, the Documents PII table, and all queues
      — over-privileged serverless execution role enabling privilege escalation and lateral movement (function-chaining
      blast radius).
    stride: E
    min_severity: CRITICAL
  - id: MF2
    description: customer-uploads S3 bucket has Block Public Access OFF and a bucket policy granting s3:GetObject
      to Principal:* — uploaded customer ID documents and PII are world-readable, an anonymous internet
      attacker can enumerate/download all objects (public bucket exposure / information disclosure of
      RESTRICTED data).
    stride: I
    min_severity: CRITICAL
  - id: MF3
    description: Presigned S3 PUT URL is issued with no content-type or content-length-range conditions
      and the ingest route is gated only by a static API key (no JWT/Cognito authorizer, no WAF) — attackers
      can mint/replay presigned URLs to upload arbitrary or oversized content (malware, zip bombs, overwrite
      of other keys), abusing presigned-URL scope and poisoning the downstream event/worker pipeline.
    stride: T
    min_severity: HIGH
  - id: MF4
    description: Third-party API tokens and the DynamoDB-encryption passphrase are stored as plaintext
      Lambda environment variables — anyone with lambda:GetFunctionConfiguration, console access, or a
      function compromise reads long-lived secrets in cleartext; secrets are not in Secrets Manager/SSM/KMS
      (cleartext storage of credentials).
    stride: I
    min_severity: HIGH
  - id: MF5
    description: The EventBridge rule pattern matches on a client-controlled `source`/detail field and
      the event flows to SQS->worker Lambda with no schema validation; an attacker can forge or inject
      event content (event-source poisoning / event injection) to trigger unintended worker processing,
      tamper with records written to DynamoDB, or smuggle malicious payloads to the parser.
    stride: T
    min_severity: HIGH
  - id: MF6
    description: SQS queue has no dead-letter queue and no server-side encryption, and there is no WAF/rate
      limiting on the public unauthenticated-grade API Gateway route — an attacker can flood ingest to
      exhaust Lambda concurrency / inflate cost (denial-of-wallet) and poison-pill messages redrive infinitely,
      while PII-bearing messages sit unencrypted at rest in the queue.
    stride: D
    min_severity: HIGH
  top_risk_candidates:
  - Public customer-uploads S3 bucket exposing customer ID documents and PII to anonymous internet (Information
    Disclosure, CRITICAL)
  - Single shared Lambda execution role with s3:*/dynamodb:*/sqs:* on Resource:* (Elevation of Privilege
    / Lateral Movement, CRITICAL)
  - Presigned-URL abuse with no content-type/length conditions and API-key-only ingest (Tampering, HIGH)
  - Plaintext secrets in Lambda environment variables (Information Disclosure, HIGH)
  required_report_sections:
  - I. Executive Summary
  - II. System Overview
  - III. Architecture Diagram
  - IV. Risk Overlay Diagram
  - V. Asset Inventory
  - VI. Threat Actor Profiles
  - VII. Findings
  - VIII. Remediation Roadmap
  - IX. Networking & Infrastructure Data (IAM Role Summary)
rubric:
- id: R1
  criterion: 'Flags the single shared Lambda execution role with s3:*/dynamodb:*/sqs:* on Resource:* as
    the over-privileged-role / privilege-escalation finding (STRIDE E and/or LM), rates it CRITICAL (OWASP
    Risk >=17), and gives a concrete attack path showing how a one-function compromise yields account-wide
    data-plane access (function-chaining blast radius). This finding ranks #1 or #2 overall.'
  weight: 5
- id: R2
  criterion: Flags the customer-uploads bucket (BPA OFF + bucket policy s3:GetObject to Principal:*) as
    public-bucket exposure of RESTRICTED customer PII / ID documents, tags it Information Disclosure (I),
    rates it CRITICAL or HIGH, and notes CIA Confidentiality = HIGH with an anonymous-attacker enumeration/download
    path. Remediation includes re-enabling Block Public Access and removing the wildcard principal.
  weight: 5
- id: R3
  criterion: Identifies presigned-URL abuse (no content-type/content-length conditions, API-key-only auth,
    no WAF) AND event-source poisoning/event injection (EventBridge rule matching client-controlled detail
    field, no event schema validation) as distinct serverless-specific findings tagged Tampering (T),
    each HIGH or above with a realistic exploit path.
  weight: 4
- id: R4
  criterion: Flags plaintext secrets in Lambda environment variables (third-party tokens + DynamoDB-encryption
    passphrase) as Information Disclosure (I), HIGH+, cites cleartext-storage / hardcoded-credentials
    weakness (e.g. CWE-312 and/or CWE-798), and recommends Secrets Manager/SSM Parameter Store with KMS.
  weight: 3
- id: R5
  criterion: Surfaces a Denial-of-Service / denial-of-wallet path against the unauthenticated-grade public
    API Gateway route (no WAF/rate limiting -> Lambda concurrency exhaustion and cost inflation) and/or
    the missing SQS DLQ + missing SQS SSE (poison-pill redrive, PII at rest unencrypted in queue), tagged
    D (and I for unencrypted queue), MEDIUM+.
  weight: 3
- id: R6
  criterion: Produces Mermaid DFD layers covering L1 architecture, L2 trust/identity (trust boundary around
    the public API Gateway edge and the IAM execution role as an identity node), L3 data (RESTRICTED/PII
    classification zone on the bucket, DynamoDB, and SQS with encryption state on edges), and an L4 threat
    overlay applying highRisk coloring + STRIDE/LxI annotations to the bucket, shared IAM role, and ingest
    path, with at least one numbered attack-path overlay.
  weight: 3
- id: R7
  criterion: 'Scores every finding with OWASP Risk Rating (Likelihood 1-5 x Impact 1-5 -> correct severity
    band) backed by PASTA-style attack paths and at least 3 named threat actor profiles relevant to a
    public cloud PII pipeline (e.g. Opportunistic/Script Kiddie scanning public buckets, Organized Crime
    after PII, Negligent Insider misconfiguration); the #1 ranked risk is the public PII bucket or the
    wildcard shared IAM role.'
  weight: 4
- id: R8
  criterion: 'Report contains the required template sections: Executive Summary (with posture rating +
    finding counts), System Overview, structural Architecture Diagram, Risk Overlay Diagram, Asset Inventory
    (classifying customer PII/ID documents as RESTRICTED/CONFIDENTIAL), Threat Actor Profiles, Findings
    (TM-NNN format with severity ordering), Remediation Roadmap (waves + quick wins), and an IAM Role
    Summary noting the shared role violates least privilege.'
  weight: 3
pass_threshold: 0.8
grounding: 'Expectations map directly to the skill''s frameworks. (1) Over-privileged shared role: frameworks.md
  Cloud-Native Threat Patterns -> Serverless-Specific ("Overly permissive execution roles", "Function
  chaining privilege escalation") and IAM & Identity ("Overly permissive IAM roles/policies"); STRIDE-LM
  E (Elevation of Privilege) + LM (Lateral Movement). Wildcard data-plane on a PII store -> CIA Confidentiality
  HIGH (CIA Impact Matrix) and OWASP A01 Broken Access Control; Likelihood high once any function is reachable,
  Impact 5 -> CRITICAL per OWASP Risk Rating bands (17-25). (2) Public bucket: Cloud-Native -> Object
  Storage ("Public bucket/blob exposure", "Bucket policy misconfiguration"); STRIDE-LM I; CWE-200/CWE-732;
  anonymous opportunistic scanner is the canonical actor (Threat Actor Profiles: Opportunistic/Script
  Kiddie, Organized Crime for PII). RESTRICTED classification of ID documents drives Impact 5 -> CRITICAL.
  (3) Presigned-URL abuse + event injection: Object Storage ("Pre-signed URL abuse") and Serverless-Specific
  ("Event injection"); STRIDE-LM T; OWASP A04 Insecure Design / A05 Misconfiguration; the client-controlled
  EventBridge detail field is textbook event-source poisoning. API-key-only with no WAF maps to OWASP
  API2/API8 and Zero Trust "verify explicitly" failure. (4) Plaintext env-var secrets: Serverless cold-start/ephemeral
  concerns + CWE-312 Cleartext Storage / CWE-798 Hard-coded Credentials (frameworks.md CWE Authentication
  + Data Protection groups); STRIDE-LM I. (5) DoS/denial-of-wallet + missing DLQ/SSE: STRIDE-LM D (CWE-400/CWE-770
  Resource Management group) and I for unencrypted PII at rest in SQS; OWASP API4 Unrestricted Resource
  Consumption. The 4-layer DFD requirement and severity-band/PASTA scoring requirements come from mermaid-layers.md
  (L1-L4 definitions) and SKILL.md Phases 2-4; required report sections come verbatim from report-template.md
  Sections I-VIII and the IAM Role Summary table in Section IX. Severity floors use OWASP Risk Rating
  bands: a world-readable RESTRICTED-PII store and an account-wide wildcard role on that PII are both
  Impact 5 with realistic likelihood, so CRITICAL is the correct floor; presigned/event-injection/secrets/DoS
  are HIGH given high impact but somewhat more conditional likelihood. This is a Team-mode system per
  SKILL.md (PII processing + cloud IaC patterns + >=10 components), justifying privacy/GRC-aware asset
  classification.'
