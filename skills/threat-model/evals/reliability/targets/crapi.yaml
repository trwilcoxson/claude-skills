# A larger, polyglot microservices target — stresses scale and multi-language recon.
id: crapi
source: https://github.com/OWASP/crAPI
description: >
  OWASP crAPI (completely ridiculous API) — an intentionally vulnerable microservices app:
  Go (community, gateway), Java/Spring (identity), Python (chatbot, workshop), TypeScript/React
  (web), MongoDB + Postgres, plus deploy/ (k8s/helm) and docker compose. ~900 source files across
  4 languages. Tests whether the skill's recon and coverage scale to a large polyglot system.
clone: git clone --depth 1 https://github.com/OWASP/crAPI.git
runs: 3
