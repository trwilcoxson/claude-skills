# A second, deliberately different target type (Infrastructure-as-Code) to show the harness is
# not web-app-specific. Same machinery, no answer key.
id: terragoat
source: https://github.com/bridgecrewio/terragoat
description: >
  TerraGoat (AWS module) — Bridgecrew's intentionally insecure Terraform: S3, KMS, RDS, IAM, EKS,
  Lambda, EC2, ELB, Elasticsearch, Neptune, ECR. A cloud/IaC attack surface (misconfig, over-broad
  IAM, public storage, unencrypted data, exposed ports) rather than application logic.
clone: git clone --depth 1 https://github.com/bridgecrewio/terragoat.git
subpath: terraform/aws   # point the run at the AWS module
runs: 3
